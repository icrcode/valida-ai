# ── Fontes analisadas ──────────────────────────────────────────────
sonar.sources=backend/src,frontend/src
sonar.tests=backend/testes,frontend/src/test

# ── Exclusões do escaneamento ──────────────────────────────────────
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/cobertura/**,\
  **/*.min.js,\
  **/lcov-report/**

# ── Cobertura de testes ────────────────────────────────────────────
sonar.javascript.lcov.reportPaths=\
  backend/cobertura/lcov.info,\
  frontend/coverage/lcov.info

# ── Duplicação: ignorar arquivos de teste ──────────────────────────
sonar.cpd.exclusions=\
  backend/testes/**,\
  frontend/src/test/**
