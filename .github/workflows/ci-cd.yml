name: CI/CD — Build, Push & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/valida-ai-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/valida-ai-frontend

jobs:
  # ─────────────────────────────────────────────
  # 1. Testes (backend e frontend em paralelo via matrix)
  # ─────────────────────────────────────────────
  test:
    name: Testes (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: backend
            cmd: npm run test:coverage
            lcov: cobertura/lcov.info
            summary: cobertura/coverage-summary.json
            node_env: test
            jwt_secret: test-secret-ci
            aws_key: test
            aws_secret: test
          - app: frontend
            cmd: npm run test:coverage
            lcov: coverage/lcov.info
            summary: coverage/coverage-summary.json
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos TypeScript
        run: npx tsc --noEmit

      - name: Rodar testes
        run: ${{ matrix.cmd }}
        env:
          NODE_ENV: ${{ matrix.node_env }}
          JWT_SECRET: ${{ matrix.jwt_secret }}
          AWS_ACCESS_KEY_ID: ${{ matrix.aws_key }}
          AWS_SECRET_ACCESS_KEY: ${{ matrix.aws_secret }}

      - name: Publicar resumo de cobertura
        run: |
          FILE="${{ matrix.summary }}"
          [ -f "$FILE" ] || exit 0
          APP="${{ matrix.app }}"
          {
            echo "## Cobertura de Testes — ${APP^}"
            echo ""
            echo "| Métrica | % | Cobertas / Total |"
            echo "|---|---|---|"
            jq -r '.total |
              "| Statements | \(.statements.pct)% | \(.statements.covered)/\(.statements.total) |",
              "| Branches   | \(.branches.pct)%   | \(.branches.covered)/\(.branches.total) |",
              "| Functions  | \(.functions.pct)%  | \(.functions.covered)/\(.functions.total) |",
              "| Lines      | \(.lines.pct)%      | \(.lines.covered)/\(.lines.total) |"
            ' "$FILE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lcov
        uses: actions/upload-artifact@v4
        with:
          name: lcov-${{ matrix.app }}
          path: ${{ matrix.app }}/${{ matrix.lcov }}
          retention-days: 1
          if-no-files-found: warn

  # ─────────────────────────────────────────────
  # 2. Análise SonarCloud
  # ─────────────────────────────────────────────
  sonar:
    name: Análise SonarCloud
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Download lcov — backend
        uses: actions/download-artifact@v4
        with:
          name: lcov-backend
          path: backend/cobertura

      - name: Download lcov — frontend
        uses: actions/download-artifact@v4
        with:
          name: lcov-frontend
          path: frontend/coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # ─────────────────────────────────────────────
  # 3. Build e push das imagens Docker
  # ─────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Hub
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Login no Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar QEMU (multi-plataforma)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Extrair metadados (tag = SHA curto)
        id: meta
        run: echo "version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build e push — Backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:latest
          cache-to: type=inline

      - name: Build e push — Frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:latest
          cache-to: type=inline

  # ─────────────────────────────────────────────
  # 4. Deploy no EC2 via SSH
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # Vai para o diretório da aplicação
            cd /opt/valida-ai

            # Atualiza o repositório (descarta alterações locais em arquivos rastreados)
            git reset --hard HEAD
            git pull origin main

            # Atualiza variável da tag da imagem
            export TAG=${{ needs.build-and-push.outputs.image-tag }}
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}

            # Faz login no Docker Hub (necessário para pull de imagens privadas)
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Puxa as novas imagens
            docker pull ${DOCKERHUB_USERNAME}/valida-ai-backend:${TAG}
            docker pull ${DOCKERHUB_USERNAME}/valida-ai-frontend:${TAG}

            # Reinicia os serviços com zero downtime
            TAG=${TAG} docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --no-build

            # Remove imagens antigas para liberar espaço
            docker image prune -f

            echo "Deploy concluido. Tag: ${TAG}"
